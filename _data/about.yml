intro:
  en: >-
    I'm a second-year doctoral student from <a href="https://bme.tsinghua.edu.cn/">School of Biomedical Engineering</a>, <a href="https://www.tsinghua.edu.cn/">Tsinghua University</a>. My research interest includes diffusion MRI and neuroscience.
  zh: >-
    我目前是<a href="https://www.tsinghua.edu.cn/">清华大学</a><a href="https://bme.tsinghua.edu.cn/">生物医学工程学院</a>的二年级博士生，研究兴趣包括弥散磁共振成像和神经科学。
advisor:
  en: >-
    I am very fortunate to be advised by <a href="https://bme.tsinghua.edu.cn/info/1068/1037.htm">Prof. Qiyuan Tian</a> of <a href="https://birthlab.github.io/">Birth Lab</a>.
  zh: >-
    很幸运能在<a href="https://birthlab.github.io/">清华大学脑影像实验室（BIRTH Lab）</a>接受<a href="https://bme.tsinghua.edu.cn/info/1068/1037.htm">田启源老师</a>的指导。
